<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veralawlaw Portfolio</title>

<style>

body{
margin:0;
font-family: Arial, sans-serif;
background:#fff;
color:#111;
}

header{
padding:100px 20px 60px;
text-align:center;
}

h1{
font-size:48px;
margin:0;
letter-spacing:1px;
}

.subtitle{
margin-top:10px;
color:#666;
}

section{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.works{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.work{
overflow:hidden;
cursor:pointer;
}

.work img{
width:100%;
height:100%;
object-fit:cover;
transition:0.4s;
display:block;
}

.work:hover img{
transform:scale(1.05);
}

footer{
text-align:center;
padding:60px;
color:#888;
font-size:14px;
}

@media(max-width:600px){
h1{
font-size:32px;
}
}

</style>
</head>

<header>

<div class="subtitle">Graphic & Visual Designer</div>
</header>

<section>

<div class="work">

<div class="work">

<div class="work">
<img src="work4.jpg">

</div>
</section>

<section>
